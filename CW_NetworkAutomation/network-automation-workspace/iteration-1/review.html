<script type="text/plain" id="r-1-with"># Adding VLAN 75 to Catalyst 9300 Access Switches

## Configuration

Apply this config to both **sw-acc-01** and **sw-acc-02**:

```
! Target: sw-acc-01 / sw-acc-02 (Catalyst 9300, IOS-XE 17.6)
! Change: Add VLAN 75 (IoT_Sensors) and trunk over Po1 to core

vlan 75
 name IoT_Sensors
!
interface Port-channel1
 switchport trunk allowed vlan add 75
 description Trunk to Core
!
end
```

**Key points:**

- The `vlan 75` block creates the VLAN and names it. If VLAN 75 already exists, this re-applies the name (idempotent).
- `switchport trunk allowed vlan add 75` appends VLAN 75 to the existing trunk allowlist on Po1 without removing any existing VLANs. This is safer than `allowed vlan` followed by a fixed list.
- No interface-level config needed; Po1 is assumed already in `switchport mode trunk` and active.

## Verification Commands

```
show vlan brief | include 75
show interface Po1 trunk
show etherchannel summary | include Po1
```

## Rollback Procedure

### Pre-change snapshot
```
copy running-config flash:pre-change-vlan75-2026-05-05.cfg
```

### If the change breaks connectivity:
```
configure replace flash:pre-change-vlan75-2026-05-05.cfg force
```

`configure replace` atomically loads the saved config and removes any lines not in it. This reverts both the VLAN and the trunk amendment in one shot.

### Alternative: Dead-man switch (if OOB console unavailable)
```
reload in 5
! Apply changes above, verify, then:
reload cancel
```

If connectivity drops, the switch automatically reloads in 5 minutes, reverting to startup-config.

## Trade-offs

- **`switchport trunk allowed vlan add 75`** vs. specifying the full VLAN list: the `add` form is safer for incremental changes and doesn't require knowing the complete current state.
- **Reload-in vs. config archive**: archive is preferred for non-routing changes (VLANs, trunk ports). Reload-in is simpler but requires a full revert to startup-config. Use reload-in only if archive is unavailable.</script>

<script type="text/plain" id="r-1-without"># VLAN 75 Configuration for Catalyst 9300 Access Switches

## Configuration to Push

### Configuration Block (Apply to sw-acc-01 and sw-acc-02)

```
! VLAN creation
vlan 75
  name IoT_Sensors
  exit

! Port-Channel interface configuration
interface Port-channel 1
  description Trunk to Core
  switchport mode trunk
  switchport trunk allowed vlan add 75
  exit
```

**Note:** On Catalyst 9300 running IOS-XE 17.6, if Po1 already exists and is trunking, you only need to add VLAN 75 to the allowed list. If Po1 doesn't exist, create it first.

## Verification Commands

```
show vlan id 75
show vlan brief | include IoT_Sensors
show interface port-channel 1
show etherchannel summary
show interface port-channel 1 trunk
show interfaces trunk
```

## Safe Rollback Procedure

### Method 1: Configuration Rollback (Preferred)

```
enable
configure terminal
  no vlan 75
  interface Port-channel 1
    no switchport trunk allowed vlan add 75
    (or: switchport trunk allowed vlan remove 75)
  exit
exit
write memory
```

### Method 2: Full Configuration Restore

If you need to revert completely and have a backup:

```
copy flash:config.backup running-config
```

### Prevention Best Practices

1. Always have console access available — Don't rely solely on SSH/in-band management when making trunk changes
2. Backup configuration before changes: `copy running-config flash:config.backup`
3. Use out-of-band management
4. Test on one switch first
5. Prepare rollback commands beforehand
6. Verify core side acceptance

## Key Reminders for IOS-XE 17.6

- Catalyst 9300 uses modern IOS-XE with standard Cisco syntax
- The `switchport trunk allowed vlan add` command appends to existing allowed VLANs (doesn't overwrite)
- Always save configuration: `write memory` or `copy running-config startup-config`</script>

<script type="text/plain" id="r-2-with"># eBGP stuck — MX480 ↔ ASR1001-X

Symptom restated: eBGP between MX480 (Junos 21.4, AS 65100) and ASR1001-X (IOS-XE 17.9, AS 65200) won't establish. Junos shows `Active`; Cisco shows `Idle/Active`. Direct point-to-point link, ASNs configured.

When BGP is stuck in `Active`, that means *one side is trying to open a TCP-179 connection and not getting a response*. Diagnostic order should follow the connection-establishment chain — fastest-to-check failures first.

## Ranked likely causes

1. **TCP/179 not reaching the other side** (ACL on Cisco, firewall-filter on Junos, or the link itself dropping it).
2. **Source-interface / update-source mismatch** — neighbor IP doesn't match what the other side expects to see as source.
3. **MD5/authentication mismatch** — one side has a password, the other doesn't, or they differ.
4. **Hold-down between flaps** — if it just changed, give it 60s before declaring it stuck.
5. **MTU / TCP-MSS** — less common at this stage.
6. **BGP-level policy** — only relevant once the session is established.

## Step-by-step diagnostic

### Step 1 — Confirm the session state

**On the MX480 (Junos):**
```
show bgp summary
show bgp neighbor <cisco-peer-ip>
```
Look for `State: Active`, `Last Error:`, `Local: <ip>`.

**On the ASR (IOS-XE):**
```
show ip bgp summary
show ip bgp neighbors <junos-peer-ip>
```
Look for `BGP state = Active`, `Last reset reason:`, `Local host: <ip>`.

The two `Local:` IPs must be reachable from each other and must match the `neighbor <ip>` configured on the opposite side.

### Step 2 — TCP/179 reachability

**Junos side:**
```
ssh
telnet <cisco-peer-ip> 179
```

**Cisco side:**
```
telnet <junos-peer-ip> 179
```

If telnet fails, check filters:

**Junos:**
```
show configuration interfaces <wan-iface> | display set | match filter
show firewall counter filter <name>
```

**Cisco:**
```
show running-config interface <wan-iface> | include access-group
show ip access-lists <ACL-NAME>
```

### Step 3 — Source-interface alignment

**Junos:**
```
show configuration protocols bgp group <group> | display set
```
Look for `local-address` or `neighbor <ip>`.

**Cisco:**
```
show running-config | section bgp
```
Look for `update-source <interface>`.

### Step 4 — Authentication

**Junos:**
```
show configuration protocols bgp group <group> neighbor <ip> | display set | match authentication
```

**Cisco:**
```
show running-config | section bgp | include password
```

### Step 5 — If still stuck, capture the SYN

**Cisco:** `debug ip bgp <peer-ip> events` (disable immediately after with `undebug all`).

**Junos:** Enable `traceoptions` for BGP open + state, commit confirmed 5, read `show log bgp-debug.log`, roll back when done.

## Most-common culprits in this scenario

- ~40%: inbound ACL/filter blocking TCP/179
- ~25%: source-interface mismatch (loopback vs physical)
- ~20%: MD5 password typo'd on one side
- ~10%: ASN config wrong (less likely here)
- ~5%: physical/MTU issues

Start with the telnet test in Step 2 — it tells you in 5 seconds whether the problem is L3/L4 or further up.</script>

<script type="text/plain" id="r-2-without"># BGP Troubleshooting: MX480 to ASR1001-X

When eBGP gets stuck in Active or Idle/Active, the session is failing to establish a TCP connection or the OPEN message is being rejected. Here's a checklist of things to verify on both sides.

## On the Juniper MX480

```
show bgp summary
show bgp neighbor 10.0.0.x
show route receive-protocol bgp 10.0.0.x
show route advertising-protocol bgp 10.0.0.x
show configuration protocols bgp
```

Look at `Last Error` and `Last State` to understand why it's transitioning out of Active.

Also useful:
```
show log messages | match bgp
monitor traffic interface ge-0/0/0 matching tcp port 179
```

## On the Cisco ASR1001-X

```
show ip bgp summary
show ip bgp neighbors 10.0.0.x
show ip route 10.0.0.x
show running-config | section bgp
debug ip bgp 10.0.0.x
debug ip tcp transactions
```

`show ip bgp neighbors` will give you state details, last reset reason, and the configured options.

## Things to check

1. **AS numbers on both sides** — double-check the `peer-as` on Junos matches the local-as on Cisco and vice versa.
2. **Source/destination IPs** — make sure each side's `neighbor` statement points to the IP that the other side is sourcing from.
3. **TCP port 179 reachability**:
   - Juniper: `telnet 10.0.0.x 179`
   - Cisco: `telnet 10.0.0.x 179`
   If either fails, an ACL or filter is blocking it.
4. **Authentication / MD5 password** — if one side has a BGP password and the other doesn't, the session will fail.
5. **MTU mismatch** — TCP-MSS clamping or path-MTU issue.
6. **Hold-time / keepalive mismatch**.
7. **Routing to the peer IP** — verify with `show route` / `show ip route`.
8. **TTL** — eBGP defaults to TTL=1; if there's any layer-3 hop, configure `multihop`.

## Order of operations

1. Verify physical link and basic IP reachability (ping).
2. Verify TCP/179 reachability (`telnet x.x.x.x 179`).
3. Inspect ACLs and firewall filters.
4. Compare `update-source` (Cisco) and `local-address` (Junos).
5. Check for password mismatch.
6. Check AS configurations.
7. If still stuck, enable debug or monitor traffic.

The Last Error / Last Reset Reason output is usually the most informative single piece of data. Start there.

## Quick sanity check

Does each side ping the other's peer IP? If not, you have an L1/L2/L3 problem. If ping works but `telnet x.x.x.x 179` fails, you have a filter problem. If telnet works but BGP is still stuck, you have a config problem (passwords, source-interface, etc.).</script>

<script type="text/plain" id="r-3-with"># Multi-vendor NTP Ansible playbook

You've got three vendors with three different network OSes, so the cleanest approach is one playbook with three plays — one per OS group — each using the official collection's NTP resource module. This stays idempotent, supports `--check --diff` dry-run, and avoids hand-pushing `ntp server` lines.

## Inventory (`inventory.yml`)

```yaml
all:
  vars:
    ansible_user: "{{ vault_net_user }}"
    ansible_password: "{{ vault_net_password }}"
    ansible_connection: ansible.netcommon.network_cli
  children:
    cisco_ios:
      hosts:
        ios-sw-01: { ansible_host: 10.10.0.11 }
        ios-sw-02: { ansible_host: 10.10.0.12 }
        # ... ios-sw-03 through ios-sw-12
      vars:
        ansible_network_os: cisco.ios.ios

    juniper_junos:
      hosts:
        ex-sw-01: { ansible_host: 10.10.1.11 }
        ex-sw-02: { ansible_host: 10.10.1.12 }
        ex-sw-03: { ansible_host: 10.10.1.13 }
        ex-sw-04: { ansible_host: 10.10.1.14 }
      vars:
        ansible_network_os: junipernetworks.junos.junos

    arista_eos:
      hosts:
        eos-sw-01: { ansible_host: 10.10.2.11 }
        eos-sw-02: { ansible_host: 10.10.2.12 }
      vars:
        ansible_network_os: arista.eos.eos
```

Credentials reference an Ansible Vault — define `vault_net_user` / `vault_net_password` in `group_vars/all/vault.yml`. Never commit plaintext credentials.

## Required collections (one-time)

```bash
ansible-galaxy collection install cisco.ios junipernetworks.junos arista.eos
```

## Playbook (`push_ntp.yml`)

```yaml
---
- name: NTP — Cisco IOS-XE
  hosts: cisco_ios
  gather_facts: false
  vars:
    ntp_servers:
      - 10.50.0.10
      - 10.50.0.11
  tasks:
    - name: Configure NTP servers (Cisco)
      cisco.ios.ios_ntp_global:
        config:
          servers:
            - server: "{{ item }}"
              version: 4
        state: merged
      loop: "{{ ntp_servers }}"

- name: NTP — Juniper Junos (EX)
  hosts: juniper_junos
  gather_facts: false
  vars:
    ntp_servers:
      - 10.50.0.10
      - 10.50.0.11
  tasks:
    - name: Configure NTP servers (Junos)
      junipernetworks.junos.junos_ntp_global:
        config:
          servers:
            - server: "{{ item }}"
        state: merged
      loop: "{{ ntp_servers }}"

- name: NTP — Arista EOS
  hosts: arista_eos
  gather_facts: false
  vars:
    ntp_servers:
      - 10.50.0.10
      - 10.50.0.11
  tasks:
    - name: Configure NTP servers (Arista)
      arista.eos.eos_ntp_global:
        config:
          servers:
            - server: "{{ item }}"
        state: merged
      loop: "{{ ntp_servers }}"
```

`state: merged` is the right default — adds NTP servers without removing existing config. Use `state: replaced` if you want to enforce *exactly* this list.

## Dry-run first

```bash
ansible-playbook -i inventory.yml push_ntp.yml --check --diff
```

The `--diff` flag shows the exact lines that would change on each device. If the diff is empty, the change is already in place — that's the idempotency you want.

## Apply

```bash
ansible-playbook -i inventory.yml push_ntp.yml
```

## Notes / trade-offs

- **`ios_ntp_global` vs older `ios_ntp`**: the `_global` resource module is the modern (5.0.0+ collection) declarative form.
- **Why not raw `ios_command` to push `ntp server` lines?** Resource modules detect drift and reconcile state. Raw command pushes don't.
- **For larger fleets**, use a NetBox dynamic inventory (`nb_inventory`) rather than a static YAML.</script>

<script type="text/plain" id="r-3-without"># Multi-vendor NTP Push Playbook

This playbook pushes NTP server configuration to a mixed inventory of Cisco IOS-XE, Juniper EX, and Arista 7050 switches.

## Inventory

```yaml
all:
  children:
    cisco:
      hosts:
        ios-01:
        # ... through ios-12
      vars:
        ansible_network_os: ios
        ansible_connection: network_cli
    juniper:
      hosts:
        ex-01:
        ex-02:
        ex-03:
        ex-04:
      vars:
        ansible_network_os: junos
        ansible_connection: netconf
    arista:
      hosts:
        eos-01:
        eos-02:
      vars:
        ansible_network_os: eos
        ansible_connection: network_cli
```

You'll want to add `ansible_host` for each device with the actual IP.

## Playbook

```yaml
---
- name: Push NTP config to Cisco IOS-XE
  hosts: cisco
  gather_facts: no
  vars:
    ntp_servers:
      - 10.50.0.10
      - 10.50.0.11
  tasks:
    - name: Configure NTP servers
      ios_config:
        lines:
          - "ntp server {{ item }}"
        save_when: modified
      loop: "{{ ntp_servers }}"

- name: Push NTP config to Juniper EX
  hosts: juniper
  gather_facts: no
  vars:
    ntp_servers:
      - 10.50.0.10
      - 10.50.0.11
  tasks:
    - name: Configure NTP servers
      junos_config:
        lines:
          - "set system ntp server {{ item }}"
        comment: "Add NTP server"
      loop: "{{ ntp_servers }}"

- name: Push NTP config to Arista EOS
  hosts: arista
  gather_facts: no
  vars:
    ntp_servers:
      - 10.50.0.10
      - 10.50.0.11
  tasks:
    - name: Configure NTP servers
      eos_config:
        lines:
          - "ntp server {{ item }}"
        save_when: modified
      loop: "{{ ntp_servers }}"
```

## Dry-run

```
ansible-playbook -i inventory.yml ntp_push.yml --check --diff
```

## Required collections

```
ansible-galaxy collection install cisco.ios
ansible-galaxy collection install junipernetworks.junos
ansible-galaxy collection install arista.eos
```

## Notes

- The `ios_config`, `junos_config`, and `eos_config` modules are part of the official collections.
- For SSH credentials, use `ansible-vault` for the password.
- The `save_when: modified` argument writes config to startup only if changes were made.</script>

<script type="text/plain" id="r-4-with"># Network Change Runbook: Allow TCP/8443 from DMZ to internal app server

| Field | Value |
|---|---|
| Change ID | CHG-NET-001 |
| Author | <your name> |
| Date | 2026-05-05 |
| Maintenance window | Tonight, 22:00–23:00 local |
| Risk | Low |
| Devices affected | FortiGate 100F (FortiOS 7.2, no VDOMs) |

## Summary

Add a new firewall policy permitting TCP/8443 from the DMZ zone to a single internal server `10.20.30.40` for application access. The change is additive only — no existing policy is modified or deleted, so blast radius is limited to traffic that would now match this rule.

## Prerequisites

- [ ] Out-of-band / console access verified
- [ ] Pre-change config backup downloaded
- [ ] Maintenance window approved
- [ ] `dmz` and `internal` zones already exist on this FortiGate

## Pre-change validation

```
execute backup config tftp pre-change-CHG-NET-001.conf <tftp-server-ip>
show system zone
show firewall policy | grep edit
show firewall address | grep app-server
show firewall service custom | grep 8443
```

## Change steps

### Step 1: Create the address object

```
config firewall address
    edit "obj-app-server-8443"
        set type ipmask
        set subnet 10.20.30.40 255.255.255.255
        set comment "App server reachable from DMZ on TCP/8443 — CHG-NET-001"
    next
end
```

Note: FortiOS uses `IP MASK` form (space-separated), not CIDR.

### Step 2: Create the custom service for TCP/8443

```
config firewall service custom
    edit "svc-tcp-8443"
        set tcp-portrange 8443
        set comment "Custom TCP/8443 — CHG-NET-001"
    next
end
```

### Step 3: Create the firewall policy

```
config firewall policy
    edit 0
        set name "ALLOW-DMZ-TO-APPSRV-8443"
        set srcintf "dmz"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "obj-app-server-8443"
        set action accept
        set schedule "always"
        set service "svc-tcp-8443"
        set logtraffic all
        set comments "CHG-NET-001 — allow TCP/8443 from DMZ to app server"
    next
end
```

`edit 0` lets FortiOS auto-assign a policy ID. Note the assigned ID for rollback.

## Post-change validation

### Test 1: Policy lookup

```
diagnose firewall iprope lookup <some-dmz-source-ip> 49152 10.20.30.40 8443 6
```

Should reference the new policy ID with `accept`.

### Test 2: Real traffic

```
# From a host on DMZ:
nc -zv 10.20.30.40 8443
```

### Test 3: Confirm logging

```
execute log filter category 0
execute log filter field policyid <new-policy-id>
execute log display
```

## Rollback

Delete in reverse order (policy → service → address):

```
config firewall policy
    delete <new-policy-id>
end

config firewall service custom
    delete svc-tcp-8443
end

config firewall address
    delete obj-app-server-8443
end
```

Reverse order matters: you can't delete an address object that's still referenced by a policy.

<script type="text/plain" id="r-4-without"># FortiGate 100F — Add Policy: DMZ to Internal Server (TCP/8443)

## Overview

This runbook covers adding a new firewall policy on a FortiGate 100F running FortiOS 7.2 (no VDOMs) to allow TCP/8443 traffic from the DMZ zone to the internal server at 10.20.30.40.

## Pre-Change Checks

1. **Backup current configuration**:
   - Via GUI: System → Settings → Configuration → Backup
   - Or CLI: `execute backup config tftp <filename> <server-ip>`
2. **Verify zone setup**: `show system zone`
3. **Note existing policy IDs**: `show firewall policy`
4. **Confirm appropriate change window** is open.

## Change Steps

### Step 1: Define the address object

```
config firewall address
    edit "Internal-App-Server"
        set subnet 10.20.30.40/32
    next
end
```

### Step 2: Define a custom service for TCP/8443

```
config firewall service custom
    edit "TCP-8443"
        set protocol TCP
        set tcp-portrange 8443
    next
end
```

### Step 3: Add the firewall policy

```
config firewall policy
    edit 0
        set name "DMZ-to-AppServer-8443"
        set srcintf "dmz"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "Internal-App-Server"
        set action accept
        set schedule "always"
        set service "TCP-8443"
        set logtraffic all
    next
end
```

The `edit 0` lets FortiOS auto-assign a policy ID.

## Validation

### Verify the policy was created

```
show firewall policy
```

### Test connectivity from a DMZ host

```
telnet 10.20.30.40 8443
```

### Check logs

Forward Traffic logs in the GUI (Log & Report → Forward Traffic) should show entries.

## Rollback

### Option A: Disable the policy

```
config firewall policy
    edit <policy-id>
        set status disable
    next
end
```

### Option B: Delete the policy and objects

```
config firewall policy
    delete <policy-id>
end
config firewall service custom
    delete TCP-8443
end
config firewall address
    delete Internal-App-Server
end
```

### Option C: Restore from backup

```
execute restore config tftp <filename> <server-ip>
```

This will reboot the firewall.

## Post-Change

1. Save: `execute save`
2. Update documentation
3. Notify stakeholders

## Notes for the Junior Engineer

- Run commands one at a time and verify each step before proceeding.
- The `0` in `edit 0` lets FortiOS pick an unused ID automatically.
- Console access is your friend if SSH stops working.</script>

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  return s;
}

function renderMd(md) {
  const lines = md.split("\n");
  const html = [];
  let inCode = false;
  let codeBuf = [];
  let inList = false;
  let inOrderedList = false;
  let inTable = false;
  let tableHeaderDone = false;

  function closeList() {
    if (inList) { html.push("</ul>"); inList = false; }
    if (inOrderedList) { html.push("</ol>"); inOrderedList = false; }
  }
  function closeTable() {
    if (inTable) { html.push("</tbody></table>"); inTable = false; tableHeaderDone = false; }
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (line.startsWith("```")) {
      if (inCode) {
        html.push("<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>");
        codeBuf = []; inCode = false;
      } else {
        closeList(); closeTable(); inCode = true;
      }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    if (line.startsWith("# ")) { closeList(); closeTable(); html.push("<h1>" + inlineMd(line.slice(2)) + "</h1>"); continue; }
    if (line.startsWith("## ")) { closeList(); closeTable(); html.push("<h2>" + inlineMd(line.slice(3)) + "</h2>"); continue; }
    if (line.startsWith("### ")) { closeList(); closeTable(); html.push("<h3>" + inlineMd(line.slice(4)) + "</h3>"); continue; }
    if (line.startsWith("> ")) { closeList(); closeTable(); html.push("<blockquote>" + inlineMd(line.slice(2)) + "</blockquote>"); continue; }

    const ulMatch = line.match(/^[-*]\s+(.*)$/);
    const olMatch = line.match(/^(\d+)\.\s+(.*)$/);

    if (ulMatch) {
      closeTable();
      if (inOrderedList) { html.push("</ol>"); inOrderedList = false; }
      if (!inList) { html.push("<ul>"); inList = true; }
      html.push("<li>" + inlineMd(ulMatch[1]) + "</li>");
      continue;
    }
    if (olMatch) {
      closeTable();
      if (inList) { html.push("</ul>"); inList = false; }
      if (!inOrderedList) { html.push("<ol>"); inOrderedList = true; }
      html.push("<li>" + inlineMd(olMatch[2]) + "</li>");
      continue;
    }

    if (line.startsWith("|")) {
      closeList();
      if (!inTable) { html.push("<table><tbody>"); inTable = true; tableHeaderDone = false; }
      const next = (lines[i+1] || "");
      if (!tableHeaderDone && /^\|[\s|:-]+\|/.test(next)) {
        const cells = line.split("|").slice(1, -1).map(c => "<th>" + inlineMd(c.trim()) + "</th>").join("");
        html.push("<tr>" + cells + "</tr>");
        i++; tableHeaderDone = true; continue;
      }
      const cells = line.split("|").slice(1, -1).map(c => "<td>" + inlineMd(c.trim()) + "</td>").join("");
      html.push("<tr>" + cells + "</tr>");
      continue;
    }

    closeList(); closeTable();
    if (line.trim() === "") continue;
    html.push("<p>" + inlineMd(line) + "</p>");
  }
  closeList(); closeTable();
  if (inCode) html.push("<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>");
  return html.join("\n");
}

function getResponse(id, cond) {

}

function passRate(arr, key) {
  const total = arr.length;
  const passed = arr.filter(a => a[key]).length;
  return { passed, total, pct: Math.round((passed / total) * 100) };
}

  summary += '<li><strong>Eval 2 (BGP)</strong> &mdash; both versions answered well; the skill version added an explicit probability ranking, but the baseline got the substance right.</li>';

  // Eval panes

            '<div class="response">' + renderMd(getResponse(e.id, "with")) + '</div></div>';
    pane += '<div class="col without-skill"><div class="col-header"><span>Baseline (no skill)</span>' +
            '<span class="grade-pill">' + wo.passed + '/' + wo.total + ' pass</span></div>' +

    pane += '</div>';

    pane += '<div class="head">Check</div><div class="head">With skill</div><div class="head">Without</div>';
    e.assertions.forEach(a => {
      pane += '<div>' + escapeHtml(a.text);
      if (a.withoutNote) pane += '<div class="baseline-note">baseline: ' + escapeHtml(a.withoutNote) + '</div>';
      pane += '</div>';
      pane += '<div class="' + (a.with ? "pass" : "fail") + '">' + (a.with ? "PASS" : "FAIL") + '</div>';
      pane += '<div class="' + (a.without ? "pass" : "fail") + '">' + (a.without ? "PASS" : "FAIL") + '</div>';
    });
    pane += '</div></div>';

    pane += '<div class="feedback-section">' +
            '<label for="fb-' + e.id + '">Your feedback on the with-skill output (anything to fix, generalize, remove?)</label>' +
            '<textarea id="fb-' + e.id + '" data-eval="' + e.id + '" placeholder="Type here. Auto-saves as you type."></textarea>' +
            '</div></section>';
    panes += pane;
  });

  main.innerHTML = summary + panes +
    '<div class="controls">' +
    '<button onclick="prevPane()">&larr; Previous</button>' +
    '<button onclick="nextPane()">Next &rarr;</button>' +
    '<button class="primary" onclick="exportFeedback()">Submit all reviews</button>' +
    '</div>';

  // Wire nav
  document.querySelectorAll("nav button").forEach(b => {
    b.addEventListener("click", () => showPane(b.dataset.id));
  });

  // Wire feedback persistence
  document.querySelectorAll("textarea[data-eval]").forEach(t => {
    const key = "fb-net-auto-iter1-" + t.dataset.eval;
    t.value = localStorage.getItem(key) || "";
    t.addEventListener("input", () => localStorage.setItem(key, t.value));
  });
}

function showPane(id) {
  document.querySelectorAll(".pane").forEach(el => el.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  const pane = document.getElementById("pane-" + id);
  if (pane) pane.classList.add("active");
  const btn = document.querySelector('nav button[data-id="' + id + '"]');
  if (btn) btn.classList.add("active");
  window.scrollTo(0, 0);
}

const order = ["summary", "1", "2", "3", "4"];
function currentPaneIndex() {
  const active = document.querySelector(".pane.active");
  if (!active) return 0;
  return order.indexOf(active.id.replace("pane-", ""));
}
function nextPane() { const i = currentPaneIndex(); if (i < order.length - 1) showPane(order[i + 1]); }
function prevPane() { const i = currentPaneIndex(); if (i > 0) showPane(order[i - 1]); }

function exportFeedback() {
  const reviews = [];
  document.querySelectorAll("textarea[data-eval]").forEach(t => {
    reviews.push({
      run_id: "eval-" + t.dataset.eval + "-with_skill",
      feedback: t.value,
      timestamp: new Date().toISOString()
    });
  });
  const out = { reviews, status: "complete", iteration: 1 };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "feedback.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  alert("feedback.json downloaded. Save it next to this HTML (or drop it back in the chat) so I can read it for iteration 2.");
}

document.addEventListener("DOMContentLoaded", render);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") nextPane();
  if (e.key === "ArrowLeft") prevPane();
});
